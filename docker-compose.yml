version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: desembola_db
    environment:
      POSTGRES_USER: ${DB_USER:-seu_usuario}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-sua_senha}
      POSTGRES_DB: ${DB_NAME:-seu_banco}
    ports:
      - "5454:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: desembola_api
    environment:
      - DB_HOST=db
      - DB_PORT=5432
      - DB_USER=${DB_USER:-seu_usuario}
      - DB_PASSWORD=${DB_PASSWORD:-sua_senha}
      - DB_NAME=${DB_NAME:-seu_banco}
      - DB_SSLMODE=disable
      - API_PORT=8080
      - CSV_FILE=lista-tickets-BJ-csv.CSV
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
